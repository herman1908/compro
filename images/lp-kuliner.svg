<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="primaryG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- Browser / Mockup Container -->
  <rect x="20" y="20" width="1360" height="460" rx="20" fill="url(#bgG)" stroke="rgba(251,146,60,0.3)" stroke-width="2" filter="url(#shadow)"/>

  <!-- Ambient Glow -->
  <circle cx="250" cy="150" r="140" fill="#ea580c" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1100" cy="300" r="160" fill="#fb923c" opacity="0.12" filter="url(#glow)"/>

  <!-- Top Browser Bar -->
  <rect x="20" y="20" width="1360" height="48" rx="20" fill="#18181b" opacity="0.9"/>
  <rect x="20" y="48" width="1360" height="20" fill="#18181b" opacity="0.9"/>
  <line x1="20" y1="68" x2="1380" y2="68" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Window dots -->
  <circle cx="50" cy="44" r="6" fill="#ef4444"/>
  <circle cx="70" cy="44" r="6" fill="#f59e0b"/>
  <circle cx="90" cy="44" r="6" fill="#10b981"/>
  <!-- URL bar -->
  <rect x="130" y="32" width="400" height="24" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
  <text x="150" y="48" fill="#a1a1aa" font-size="11" class="font-sans">🔒 https://aromaresto-cafe.com</text>

  <!-- Navbar inside Landing Page -->
  <g transform="translate(60, 95)">
    <!-- Logo -->
    <text x="0" y="22" fill="#fb923c" font-size="22" font-weight="800" class="font-sans">☕ Aroma<tspan fill="#f97316">Kitchen</tspan></text>
    <!-- Nav Links -->
    <text x="240" y="20" fill="#f43f5e" font-size="12" font-weight="600" class="font-sans">Beranda</text>
    <text x="320" y="20" fill="#a8a29e" font-size="12" class="font-sans">Menu Favorit</text>
    <text x="430" y="20" fill="#a8a29e" font-size="12" class="font-sans">Tentang Kami</text>
    <text x="540" y="20" fill="#a8a29e" font-size="12" class="font-sans">Ulasan</text>
    <text x="610" y="20" fill="#a8a29e" font-size="12" class="font-sans">Lokasi</text>
    <!-- Nav CTA -->
    <rect x="1100" y="0" width="160" height="32" rx="16" fill="url(#primaryG)"/>
    <text x="1180" y="20" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" class="font-sans">Order Menu WA ➔</text>
  </g>

  <!-- Hero Content Left -->
  <g transform="translate(60, 165)">
    <!-- Tag Pill -->
    <rect x="0" y="0" width="220" height="26" rx="13" fill="rgba(251,146,60,0.15)" stroke="rgba(251,146,60,0.4)" stroke-width="1"/>
    <text x="15" y="17" fill="#fdba74" font-size="11" font-weight="600" class="font-sans">🔥 Resto &amp; Coffee Shop Pilihan Tangerang</text>

    <!-- Main Headline -->
    <text x="0" y="65" fill="#fafaf9" font-size="34" font-weight="800" class="font-sans">
      Sensasi Rasa Autentik &amp;
    </text>
    <text x="0" y="105" fill="#fb923c" font-size="34" font-weight="800" class="font-sans">
      Tempat Nongkrong Modern
    </text>

    <!-- Description -->
    <text x="0" y="145" fill="#a8a29e" font-size="14" class="font-sans">
      Nikmati racikan artisan coffee terbaik dan menu kuliner nusantara-western
    </text>
    <text x="0" y="167" fill="#a8a29e" font-size="14" class="font-sans">
      dalam suasana cozy berfasilitas lengkap: WiFi kencang, colokan, dan live music.
    </text>

    <!-- CTA Buttons -->
    <rect x="0" y="200" width="170" height="44" rx="22" fill="url(#primaryG)"/>
    <text x="85" y="227" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle" class="font-sans">🍽️ Lihat Menu QR</text>

    <rect x="185" y="200" width="160" height="44" rx="22" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)"/>
    <text x="265" y="227" fill="#f5f5f4" font-size="13" font-weight="600" text-anchor="middle" class="font-sans">📍 Reservasi Meja</text>

    <!-- Mini Social Proof -->
    <g transform="translate(0, 265)">
      <text x="0" y="18" fill="#fbbf24" font-size="14" font-weight="700" class="font-sans">★★★★★ 4.9</text>
      <text x="90" y="18" fill="#78716c" font-size="12" class="font-sans">| 2,400+ Pelanggan Puas &amp; Food Blogger</text>
    </g>
  </g>

  <!-- Hero Content Right (Card Mockup Showcase) -->
  <g transform="translate(820, 140)">
    <!-- Main Card -->
    <rect x="0" y="0" width="460" height="300" rx="18" fill="url(#cardG)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#shadow)"/>

    <!-- Card Header -->
    <rect x="18" y="18" width="100" height="24" rx="6" fill="#f97316"/>
    <text x="68" y="34" fill="#fff" font-size="10" font-weight="700" text-anchor="middle" class="font-sans">PROMO HARI INI</text>

    <!-- Item 1 -->
    <g transform="translate(20, 56)">
      <rect x="0" y="0" width="420" height="66" rx="12" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)"/>
      <rect x="10" y="10" width="46" height="46" rx="8" fill="#ea580c"/>
      <text x="33" y="38" fill="#fff" font-size="22" text-anchor="middle">☕</text>
      <text x="68" y="28" fill="#fafaf9" font-size="13" font-weight="700" class="font-sans">Artisan Hazelnut Cold Brew</text>
      <text x="68" y="46" fill="#a8a29e" font-size="11" class="font-sans">100% Arabica Specialty • Less Sugar</text>
      <text x="350" y="38" fill="#fb923c" font-size="13" font-weight="700" class="font-sans">Rp 28.000</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(20, 132)">
      <rect x="0" y="0" width="420" height="66" rx="12" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)"/>
      <rect x="10" y="10" width="46" height="46" rx="8" fill="#c2410c"/>
      <text x="33" y="38" fill="#fff" font-size="22" text-anchor="middle">🥩</text>
      <text x="68" y="28" fill="#fafaf9" font-size="13" font-weight="700" class="font-sans">Wagyu Rice Bowl Sambal Matah</text>
      <text x="68" y="46" fill="#a8a29e" font-size="11" class="font-sans">Tender Meltique Beef • Free Es Teh</text>
      <text x="350" y="38" fill="#fb923c" font-size="13" font-weight="700" class="font-sans">Rp 45.000</text>
    </g>

    <!-- Bottom summary inside card -->
    <g transform="translate(20, 210)">
      <rect x="0" y="0" width="420" height="70" rx="12" fill="rgba(251,146,60,0.12)" stroke="rgba(251,146,60,0.3)"/>
      <text x="20" y="30" fill="#fafaf9" font-size="12" font-weight="600" class="font-sans">🛵 Pesan Online Mudah Langsung ke Kasir WA</text>
      <text x="20" y="50" fill="#a8a29e" font-size="11" class="font-sans">Dilengkapi QR Menu Meja &amp; Integrasi POS Kasir Otomatis</text>
      <rect x="315" y="16" width="90" height="38" rx="19" fill="#16a34a"/>
      <text x="360" y="40" fill="#fff" font-size="11" font-weight="700" text-anchor="middle" class="font-sans">Order ➔</text>
    </g>
  </g>
</svg>