  <!-- Right Dashboard / Analytics Mockup -->
  <g transform="translate(820, 140)">
    <rect x="0" y="0" width="460" height="300" rx="18" fill="url(#corpCardG)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#corpShadow)"/>

    <!-- Top mini stats -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="130" height="65" rx="10" fill="rgba(15,23,42,0.6)" stroke="rgba(255,255,255,0.06)"/>
      <text x="15" y="25" fill="#94a3b8" font-size="10" class="font-sans">KLIEN AKTIF</text>
      <text x="15" y="50" fill="#38bdf8" font-size="18" font-weight="800" class="font-sans">350+</text>

      <rect x="145" y="0" width="130" height="65" rx="10" fill="rgba(15,23,42,0.6)" stroke="rgba(255,255,255,0.06)"/>
