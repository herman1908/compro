      <circle cx="26" cy="26" r="14" fill="#0284c7"/>
      <text x="26" y="31" fill="#fff" font-size="12" text-anchor="middle">⚖️</text>
      <text x="50" y="24" fill="#f8fafc" font-size="12" font-weight="700" class="font-sans">Pendirian PT, CV, &amp; Legalitas Perizinan Usaha</text>
      <text x="50" y="40" fill="#94a3b8" font-size="10" class="font-sans">Proses kilat 3 hari kerja, terintegrasi OSS RBA</text>
      <text x="375" y="32" fill="#38bdf8" font-size="11" font-weight="700" class="font-sans">Detail ➔</text>
    </g>

    <g transform="translate(20, 162)">
      <rect x="0" y="0" width="420" height="52" rx="10" fill="rgba(15,23,42,0.6)" stroke="rgba(255,255,255,0.06)"/>
      <circle cx="26" cy="26" r="14" fill="#2563eb"/>
      <text x="26" y="31" fill="#fff" font-size="12" text-anchor="middle">📈</text>
      <text x="50" y="24" fill="#f8fafc" font-size="12" font-weight="700" class="font-sans">Audit Finansial &amp; Perencanaan Pajak Korporasi</text>
      <text x="50" y="40" fill="#94a3b8" font-size="10" class="font-sans">Kepatuhan regulasi fiskal dan efisiensi pelaporan pajak</text>
      <text x="375" y="32" fill="#38bdf8" font-size="11" font-weight="700" class="font-sans">Detail ➔</text>
    </g>

    <g transform="translate(20, 226)">
      <rect x="0" y="0" width="420" height="54" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <text x="20" y="24" fill="#f8fafc" font-size="11" font-weight="600" class="font-sans">🤝 Ingin Konsultasi Eksklusif dengan Konsultan Senior?</text>
      <text x="20" y="42" fill="#64748b" font-size="10" class="font-sans">Tersedia konsultasi daring (Zoom) &amp; tatap muka di kantor pusat kami</text>
      <rect x="330" y="12" width="75" height="30" rx="15" fill="#0284c7"/>
      <text x="367" y="31" fill="#fff" font-size="10" font-weight="700" text-anchor="middle" class="font-sans">Daftar</text>
    </g>
  </g>
</svg>