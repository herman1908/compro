    </text>

    <rect x="0" y="200" width="190" height="44" rx="22" fill="url(#corpPrimaryG)"/>
    <text x="95" y="227" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle" class="font-sans">Hubungi Konsultan</text>

    <rect x="205" y="200" width="190" height="44" rx="22" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.2)"/>
    <text x="300" y="227" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle" class="font-sans">Unduh Company Profile</text>

    <g transform="translate(0, 265)">
