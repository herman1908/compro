      <text x="160" y="50" fill="#10b981" font-size="18" font-weight="800" class="font-sans">1,240+</text>

      <rect x="290" y="0" width="130" height="65" rx="10" fill="rgba(15,23,42,0.6)" stroke="rgba(255,255,255,0.06)"/>
      <text x="305" y="25" fill="#94a3b8" font-size="10" class="font-sans">RETENSI KLIEN</text>
      <text x="305" y="50" fill="#fbbf24" font-size="18" font-weight="800" class="font-sans">99.4%</text>
