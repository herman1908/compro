<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="storeBgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#051b14"/>
    </linearGradient>
    <linearGradient id="storePrimaryG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="storeCardG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="storeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="storeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- Container -->
  <rect x="20" y="20" width="1360" height="460" rx="20" fill="url(#storeBgG)" stroke="rgba(52,211,153,0.3)" stroke-width="2" filter="url(#storeShadow)"/>

  <!-- Glows -->
  <circle cx="220" cy="170" r="150" fill="#10b981" opacity="0.15" filter="url(#storeGlow)"/>
  <circle cx="1120" cy="290" r="160" fill="#059669" opacity="0.15" filter="url(#storeGlow)"/>

  <!-- Header Bar -->
  <rect x="20" y="20" width="1360" height="48" rx="20" fill="#06221a" opacity="0.95"/>
  <rect x="20" y="48" width="1360" height="20" fill="#06221a" opacity="0.95"/>
  <line x1="20" y1="68" x2="1380" y2="68" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Dots -->
  <circle cx="50" cy="44" r="6" fill="#ef4444"/>
  <circle cx="70" cy="44" r="6" fill="#f59e0b"/>
  <circle cx="90" cy="44" r="6" fill="#10b981"/>
  <!-- URL -->
  <rect x="130" y="32" width="400" height="24" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
  <text x="150" y="48" fill="#a7f3d0" font-size="11" class="font-sans">🔒 https://urbanstyle-official.store</text>

  <!-- Navbar -->
  <g transform="translate(60, 95)">
    <text x="0" y="22" fill="#34d399" font-size="22" font-weight="800" class="font-sans">🛍️ URBAN<tspan fill="#ffffff">STORE</tspan></text>
    <text x="240" y="20" fill="#34d399" font-size="12" font-weight="600" class="font-sans">New Arrival</text>
    <text x="340" y="20" fill="#a7f3d0" font-size="12" class="font-sans">Koleksi Pria</text>
    <text x="440" y="20" fill="#a7f3d0" font-size="12" class="font-sans">Koleksi Wanita</text>
    <text x="560" y="20" fill="#a7f3d0" font-size="12" class="font-sans">Flash Sale (Diskon 50%)</text>
    <text x="730" y="20" fill="#a7f3d0" font-size="12" class="font-sans">Lacak Paket</text>
    <rect x="1110" y="0" width="150" height="32" rx="16" fill="url(#storePrimaryG)"/>
    <text x="1185" y="20" fill="#022c22" font-size="12" font-weight="800" text-anchor="middle" class="font-sans">🛒 Keranjang (3)</text>
  </g>

  <!-- Left Content -->
  <g transform="translate(60, 165)">
    <rect x="0" y="0" width="240" height="26" rx="13" fill="rgba(52,211,153,0.15)" stroke="rgba(52,211,153,0.3)" stroke-width="1"/>
    <text x="15" y="17" fill="#6ee7b7" font-size="11" font-weight="600" class="font-sans">⚡ Brand Fashion Terlaris Musim Ini</text>

    <text x="0" y="65" fill="#f0fdf4" font-size="33" font-weight="800" class="font-sans">
      Koleksi Streetwear Premium
    </text>
    <text x="0" y="105" fill="#34d399" font-size="33" font-weight="800" class="font-sans">
      Bahan Organik &amp; Tahan Lama
    </text>

    <text x="0" y="145" fill="#a7f3d0" font-size="14" class="font-sans">
      Tampil percaya diri dengan outfit santai modern pilihan influencer terkemuka.
    </text>
    <text x="0" y="167" fill="#a7f3d0" font-size="14" class="font-sans">
      Dapatkan voucher potongan belanja Rp 50.000 untuk transaksi perdana hari ini!
    </text>

    <rect x="0" y="200" width="180" height="44" rx="22" fill="url(#storePrimaryG)"/>
    <text x="90" y="227" fill="#022c22" font-size="13" font-weight="800" text-anchor="middle" class="font-sans">Beli Sekarang ➔</text>

    <rect x="195" y="200" width="170" height="44" rx="22" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)"/>
    <text x="280" y="227" fill="#f0fdf4" font-size="13" font-weight="600" text-anchor="middle" class="font-sans">Katalog Lengkap</text>

    <g transform="translate(0, 265)">
      <text x="0" y="18" fill="#34d399" font-size="13" font-weight="700" class="font-sans">🚚 Gratis Ongkir Se-Indonesia</text>
      <text x="200" y="18" fill="#6ee7b7" font-size="12" class="font-sans">| Garansi Tukar Ukuran 100% | COD &amp; PayLater</text>
    </g>
  </g>

  <!-- Right Showcase Products -->
  <g transform="translate(820, 140)">
    <rect x="0" y="0" width="460" height="300" rx="18" fill="url(#storeCardG)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" filter="url(#storeShadow)"/>

    <!-- Product 1 -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="420" height="75" rx="12" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.06)"/>
      <rect x="12" y="10" width="55" height="55" rx="8" fill="#047857"/>
      <text x="39" y="44" fill="#fff" font-size="26" text-anchor="middle">👕</text>
      <text x="80" y="30" fill="#f0fdf4" font-size="13" font-weight="700" class="font-sans">Oversized Heavy Cotton Tee (Sage Green)</text>
      <text x="80" y="48" fill="#6ee7b7" font-size="11" class="font-sans">100% Katun Combed 24s • Terjual 1,800+</text>
      <text x="80" y="62" fill="#fbbf24" font-size="10" class="font-sans">★★★★★ (4.9)</text>
      <text x="340" y="44" fill="#34d399" font-size="13" font-weight="800" class="font-sans">Rp 129.000</text>
    </g>

    <!-- Product 2 -->
    <g transform="translate(20, 105)">
      <rect x="0" y="0" width="420" height="75" rx="12" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.06)"/>
      <rect x="12" y="10" width="55" height="55" rx="8" fill="#065f46"/>
      <text x="39" y="44" fill="#fff" font-size="26" text-anchor="middle">🧥</text>
      <text x="80" y="30" fill="#f0fdf4" font-size="13" font-weight="700" class="font-sans">Tokyo Waterproof Windbreaker Jacket</text>
      <text x="80" y="48" fill="#6ee7b7" font-size="11" class="font-sans">Anti Air &amp; Windproof • Tali Serut Fleksibel</text>
      <text x="80" y="62" fill="#fbbf24" font-size="10" class="font-sans">★★★★★ (4.8)</text>
      <text x="340" y="44" fill="#34d399" font-size="13" font-weight="800" class="font-sans">Rp 249.000</text>
    </g>

    <!-- Checkout Footer in card -->
    <g transform="translate(20, 195)">
      <rect x="0" y="0" width="420" height="85" rx="12" fill="rgba(16,185,129,0.12)" stroke="rgba(52,211,153,0.3)"/>
      <text x="20" y="30" fill="#f0fdf4" font-size="12" font-weight="700" class="font-sans">⚡ Checkout Cepat Tanpa Ribet</text>
      <text x="20" y="50" fill="#a7f3d0" font-size="11" class="font-sans">Dukung QRIS, Transfer Bank, ShopeePay &amp; Bayar di Tempat (COD)</text>
      <text x="20" y="68" fill="#6ee7b7" font-size="10" class="font-sans">Terintegrasi otomatis dengan sistem WhatsApp CRM Admin</text>
      <rect x="315" y="24" width="90" height="40" rx="20" fill="#10b981"/>
      <text x="360" y="48" fill="#022c22" font-size="11" font-weight="800" text-anchor="middle" class="font-sans">Beli Cepat ➔</text>
    </g>
  </g>
</svg>